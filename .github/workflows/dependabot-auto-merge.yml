name: Dependabot auto-merge and version bump

on:
  pull_request:
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: write
  pull-requests: write

jobs:
  auto-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@v2
        with:
          github-token: ${{ github.token }}

      - name: Auto-approve patch and minor updates
        if: >
          steps.metadata.outputs.update-type == 'version-update:semver-patch' ||
          steps.metadata.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh pr review "${{ github.event.pull_request.html_url }}" --approve
          gh pr merge "${{ github.event.pull_request.html_url }}" --auto --squash

  bump-on-merge:
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    needs: auto-merge
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Bump patch version in pyproject.toml
        run: |
          python3 -c "
          import re, pathlib
          p = pathlib.Path('pyproject.toml')
          text = p.read_text()
          match = re.search(r'version\s*=\s*\"(\d+)\.(\d+)\.(\d+)\"', text)
          if match:
              major, minor, patch = int(match.group(1)), int(match.group(2)), int(match.group(3))
              new_version = f'{major}.{minor}.{patch + 1}'
              text = text.replace(match.group(0), f'version = \"{new_version}\"')
              p.write_text(text)
              print(f'Bumped version to {new_version}')
          "

      - name: Commit version bump
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml
          if git diff --cached --quiet; then
            echo "No version change needed"
          else
            git commit -m "Bump patch version after dependency update"
            git push
          fi
